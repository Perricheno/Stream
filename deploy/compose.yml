# Server (Express + Socket.io + yt-dlp downloader) for a plain Docker host.
#
#   cd /opt/watch2cp                # wherever the repo is checked out
#   cp deploy/server.env.example deploy/server.env && edit deploy/server.env
#   docker compose -f deploy/compose.yml up -d --build
#
# The container port is published on localhost only — put a cloudflared
# tunnel hostname (e.g. api.perricheno.com) in front of 127.0.0.1:4000.

services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: watch2cp-server:latest
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    env_file:
      - ./server.env
    environment:
      # Fixed regardless of what's in server.env — both live on the volume.
      DB_PATH: /data/stream.db
      MEDIA_DIR: /data/media
      PORT: "4000"
      # YouTube PO-token provider (the bgutil sidecar below, same network).
      YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - watch2cp-data:/data

  # Generates the YouTube PO tokens yt-dlp needs to get playable formats at
  # all. Stateless; no volume. Talks only to `server` over the compose network.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    expose:
      - "4416"

volumes:
  watch2cp-data:
