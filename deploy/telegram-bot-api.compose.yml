# Self-hosted Telegram Local Bot API Server.
#
# Why: the public Bot API (api.telegram.org) caps `getFile` downloads at
# 20 MB. Users send full-quality videos straight to the bot as a file, so
# without this the "send a file to the bot" path is effectively unusable.
# Running the API locally raises that cap to 2000 MB.
#
# Usage:
#   1. Get api_id / api_hash from https://my.telegram.org (Apps).
#   2. Put them in <repo root>/.env on the host (TELEGRAM_API_ID=...,
#      TELEGRAM_API_HASH=...) — deploy.sh picks this file up automatically
#      and includes this compose file whenever it's present.
#   3. In deploy/server.env set:
#        TELEGRAM_BOT_API_BASE_URL=http://telegram-bot-api:8081
#      (the service name below, reachable because deploy.sh brings this file
#      up together with deploy/compose.yml on the same network).
#
# Do NOT pass --local: in local mode getFile returns an absolute filesystem
# path instead of an HTTP-fetchable one, which this app's downloader does not
# use. The default HTTP file endpoint (/file/bot<token>/<path>) is what it
# expects, and it works identically to the public API.

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?set TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}"
      # 2000 MB, in bytes — the max Telegram allows a Local Bot API Server.
      TELEGRAM_MAX_FILE_SIZE: "2097152000"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
